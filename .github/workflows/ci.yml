name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: shellcheck
        run: |
          shellcheck --version
          find scripts -name '*.sh' -print0 | xargs -0 shellcheck --severity=warning

      - name: JavaScript syntax
        run: |
          node --version
          find scripts -name '*.mjs' -print0 | xargs -0 -n1 node --check
          find templates/lib -name '*.js' -print0 | xargs -0 -n1 node --check
